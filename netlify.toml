[build]
  command = "npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "22"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[redirects]]
  from = "/you"
  to = "/personal-support/"
  status = 301
[[redirects]]
  from = "/business"
  to = "/fractional-support/"
  status = 301
[[redirects]]
  from = "/teams"
  to = "/fractional-support/"
  status = 301
[[redirects]]
  from = "/contact"
  to = "/enquire/"
  status = 301
